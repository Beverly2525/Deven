name: Transcribe Podcast

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install transcription tools
        run: python -m pip install -q faster-whisper
      - name: Download podcast audio
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o podcast.m4a \
            'https://media.xyzcdn.net/ljeZTmehRpPYIc2jUGTm5gJ5I7OI.m4a'
          test -s podcast.m4a
          ls -lh podcast.m4a
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 podcast.m4a
      - name: Transcribe Chinese audio
        run: |
          cat > transcribe.py <<'PY'
          from faster_whisper import WhisperModel
          import json
          audio='podcast.m4a'
          model=WhisperModel('small',device='cpu',compute_type='int8',cpu_threads=4)
          segments,info=model.transcribe(audio,language='zh',beam_size=1,best_of=1,
              vad_filter=True,vad_parameters={'min_silence_duration_ms':500},
              condition_on_previous_text=True)
          rows=[]
          def ts(sec):
              ms=int(round(sec*1000)); h=ms//3600000; ms%=3600000; m=ms//60000; ms%=60000; s=ms//1000; ms%=1000
              return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'
          with open('podcast_transcript.txt','w',encoding='utf-8') as ft,open('podcast_transcript.srt','w',encoding='utf-8') as fs:
              for i,seg in enumerate(segments,1):
                  text=seg.text.strip(); rows.append({'start':seg.start,'end':seg.end,'text':text})
                  ft.write(f'[{seg.start:8.2f} --> {seg.end:8.2f}] {text}\n')
                  fs.write(f'{i}\n{ts(seg.start)} --> {ts(seg.end)}\n{text}\n\n')
          with open('podcast_transcript.json','w',encoding='utf-8') as f:
              json.dump({'language':info.language,'duration':info.duration,'segments':rows},f,ensure_ascii=False,indent=2)
          print('segments',len(rows),'duration',info.duration)
          PY
          python transcribe.py
          wc -c podcast_transcript.*
      - name: Upload transcript
        uses: actions/upload-artifact@v4
        with:
          name: podcast-transcript
          path: |
            podcast_transcript.txt
            podcast_transcript.srt
            podcast_transcript.json
          retention-days: 1
