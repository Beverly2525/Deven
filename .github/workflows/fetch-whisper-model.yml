name: Fetch Whisper Model

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper model
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 10 \
            -o ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          test -s ggml-small-q5_1.bin
          sha256sum ggml-small-q5_1.bin > SHA256SUMS.txt
          zip -9 whisper-small-q5_1.zip ggml-small-q5_1.bin SHA256SUMS.txt
      - name: Upload model archive
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5_1
          path: whisper-small-q5_1.zip
          retention-days: 1
          compression-level: 0
